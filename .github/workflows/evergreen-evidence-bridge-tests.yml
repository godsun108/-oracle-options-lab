name: Evergreen Evidence Bridge Tests
on:
  push:
    paths:
      - 'research/evergreen_evidence_bridge_v1.py'
      - 'research/test_evergreen_evidence_bridge_v1.py'
      - '.github/workflows/evergreen-evidence-bridge-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s research -p 'test_evergreen_evidence_bridge_v1.py' -v
