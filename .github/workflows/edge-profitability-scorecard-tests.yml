name: Edge Profitability Scorecard Tests
on:
  push:
    paths:
      - 'research/edge_profitability_scorecard_v1.py'
      - 'research/test_edge_profitability_scorecard_v1.py'
      - '.github/workflows/edge-profitability-scorecard-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s research -p 'test_edge_profitability_scorecard_v1.py' -v
