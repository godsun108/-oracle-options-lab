name: Cross-run paper snapshot restore (synthetic only)

on:
  pull_request:
    paths:
      - '.github/workflows/cross-run-paper-restore.yml'
      - 'research/persistent_forward_runner.py'
      - 'research/paper_state_snapshot.py'
      - 'research/continuous_fixture.py'
      - 'tests/test_continuous_fixture.py'
  schedule:
    - cron: '17 23 * * 1-5'
  workflow_dispatch:
    inputs:
      previous_run_id:
        description: "Prior successful run ID of this workflow; leave blank for bootstrap"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: synthetic-paper-state-chain
  cancel-in-progress: false

jobs:
  restore-and-advance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate synthetic test plan
        run: python -m research.fixture_paper_session
      - name: Resolve prior successful run
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_RUN: ${{ inputs.previous_run_id }}
        run: |
          if [ -n "$MANUAL_RUN" ]; then
            PREVIOUS_RUN="$MANUAL_RUN"
          else
            PREVIOUS_RUN=$(gh run list --repo "${{ github.repository }}" --workflow cross-run-paper-restore.yml --branch main --status success --limit 15 --json databaseId --jq '.[0].databaseId // empty')
          fi
          echo "run_id=$PREVIOUS_RUN" >> "$GITHUB_OUTPUT"
      - name: Download previous snapshot if provided
        if: ${{ steps.previous.outputs.run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN: ${{ steps.previous.outputs.run_id }}
        run: |
          case "$PREVIOUS_RUN" in
            *[!0-9]*|'') echo "Invalid prior run ID"; exit 1;;
          esac
          mkdir -p restore
          STATUS=$(gh run view "$PREVIOUS_RUN" --repo "${{ github.repository }}" --json conclusion --jq .conclusion)
          test "$STATUS" = "success" || { echo "Prior run not successful"; exit 1; }
          gh run download "$PREVIOUS_RUN" --repo "${{ github.repository }}" --name paper-state --dir restore
          test -s restore/forward.json
          cp restore/forward.json paper_state/forward.json
      - name: Generate next synthetic batch
        env:
          PREVIOUS_RUN: ${{ steps.previous.outputs.run_id }}
        run: |
          if [ -n "$PREVIOUS_RUN" ]; then
            test -s restore/report.json
            SEQUENCE=$(python -c 'import json; r=json.load(open("restore/report.json")); t=r["last_bar"]; assert t.startswith("fixture-"); print(int(t.split("-")[1])//2)')
          else
            SEQUENCE=0
          fi
          echo "sequence=$SEQUENCE" >> "$GITHUB_ENV"
          python -m research.continuous_fixture --sequence "$SEQUENCE"
      - name: Process fixture and verify state
        run: |
          python -m research.persistent_forward_runner --plan paper_state/fixture-plan.json --bars paper_state/fixture-bars.json --state paper_state/forward.json --report paper_state/report.json
          python -c 'import json,os; p=json.load(open("paper_state/report.json")); assert p["mode"]=="FORWARD_PAPER_ONLY" and p["orders_enabled"] is False; assert p["accepted_bars"]==2; assert p["last_bar"]=="fixture-{:08d}".format((int(os.environ["SEQUENCE"])+1)*2); print(p)'
        env:
          SEQUENCE: ${{ env.sequence }}
      - name: Upload verified synthetic snapshot
        uses: actions/upload-artifact@v4
        with:
          name: paper-state
          path: |
            paper_state/forward.json
            paper_state/report.json
          retention-days: 30
          if-no-files-found: error
