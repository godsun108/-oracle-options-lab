name: Oracle Options Extract
on:
  push:
    paths: ['.github/workflows/oracle-extract.yml']
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --upgrade pandas pyarrow requests numpy
      - name: Run frozen Oracle II O1-O6 EOD backtest
        shell: bash
        run: |
          cat > /tmp/oracle.py <<'PY'
          import io, os, requests, pandas as pd, numpy as np
          BASE="https://raw.githubusercontent.com/anahatsingh-ui/options-dataset-hist/main/spy/options_{}.parquet"
          U="https://raw.githubusercontent.com/OStochastic/Daily-SPY-data-from-2000-2025/main/spy_data.csv"
          os.makedirs("out",exist_ok=True)

          # Underlying signal: Oracle II Candidate #1, frozen before option outcomes.
          u=pd.read_csv(io.StringIO(requests.get(U,timeout=60).text),skiprows=[1,2])
          u.columns=["date","close","high","low","open","volume"]
          u["date"]=pd.to_datetime(u.date); u=u.sort_values("date").reset_index(drop=True)
          u["ma200"]=u.close.rolling(200).mean()
          u["vol20_prior"]=u.volume.shift(1).rolling(20).mean()
          u["ret5"]=u.close.pct_change(5)
          u["signal"]=(u.ret5<=-.02)&(u.close>u.ma200)&(u.volume<u.vol20_prior)
          # Reconstruction diagnostic: compare plausible interpretations of "5-session decline".
          # This does NOT alter the frozen options test.
          u["ret1"]=u.close.pct_change()
          u["sum5ret"]=u.ret1.rolling(5).sum()
          u["prod5ret"]=(1+u.ret1).rolling(5).apply(np.prod,raw=True)-1
          u["drop_from_5d_high"]=u.close/u.close.rolling(5).max()-1
          u["drop_from_prior5_high"]=u.close/u.close.shift(1).rolling(5).max()-1
          u["five_day_low_vs_start"]=u.close/u.close.shift(4)-1
          base=(u.close>u.ma200)&(u.volume<u.vol20_prior)
          variants={
            "pct_change_5":u.ret5<=-.02,
            "sum_5_daily_returns":u.sum5ret<=-.02,
            "compound_5_daily_returns":u.prod5ret<=-.02,
            "drop_from_5d_high":u.drop_from_5d_high<=-.02,
            "drop_from_prior5_high":u.drop_from_prior5_high<=-.02,
            "close_vs_4_sessions_ago":u.five_day_low_vs_start<=-.02,
          }
          audit_rows=[]
          for nm,cond in variants.items():
              z=u.loc[base&cond,["date"]].copy()
              z["period"]=np.select([z.date.dt.year<=2016,z.date.dt.year<=2021],["2000-2016","2017-2021"],default="2022-2025")
              c=z.groupby("period").size()
              audit_rows.append({"variant":nm,"discovery":int(c.get("2000-2016",0)),"validation":int(c.get("2017-2021",0)),"holdout":int(c.get("2022-2025",0)),"total":len(z)})
          pd.DataFrame(audit_rows).to_csv("out/oracle_reconstruction_variants.csv",index=False)

          # Stage 2: isolate volume/MA convention differences against the 107/55/18 fingerprint.
          u["ma200_prior"]=u.close.shift(1).rolling(200).mean()
          u["vol20_including_current"]=u.volume.rolling(20).mean()
          u["vol20_sma_shifted"]=u.volume.rolling(20).mean().shift(1)
          price_conds={"ret5":u.ret5<=-.02,"prior5high":u.drop_from_prior5_high<=-.02}
          ma_conds={"ma200_current":u.close>u.ma200,"ma200_prior":u.close>u.ma200_prior,"no_ma":pd.Series(True,index=u.index)}
          vol_conds={
            "vol_below_prior20":u.volume<u.vol20_prior,
            "vol_below_current20":u.volume<u.vol20_including_current,
            "vol_below_shifted20":u.volume<u.vol20_sma_shifted,
            "vol_above_prior20":u.volume>u.vol20_prior,
            "no_volume":pd.Series(True,index=u.index)}
          stage2=[]
          for pn,pc in price_conds.items():
            for mn,mc in ma_conds.items():
              for vn,vc in vol_conds.items():
                z=u.loc[pc&mc&vc,["date"]].copy()
                z["period"]=np.select([z.date.dt.year<=2016,z.date.dt.year<=2021],["2000-2016","2017-2021"],default="2022-2025")
                c=z.groupby("period").size()
                stage2.append({"price":pn,"ma":mn,"volume":vn,"discovery":int(c.get("2000-2016",0)),"validation":int(c.get("2017-2021",0)),"holdout":int(c.get("2022-2025",0)),"total":len(z),
                  "fingerprint_error":abs(int(c.get("2000-2016",0))-107)+abs(int(c.get("2017-2021",0))-55)+abs(int(c.get("2022-2025",0))-18)})
          pd.DataFrame(stage2).sort_values(["fingerprint_error","total"]).to_csv("out/oracle_stage2_grid.csv",index=False)

          # Stage 3: test threshold/operator conventions without touching option outcomes.
          stage3=[]
          rets={"ret4":u.close.pct_change(4),"ret5":u.close.pct_change(5),"ret6":u.close.pct_change(6)}
          thresholds=[-.01,-.0125,-.015,-.0175,-.02,-.0225,-.025,-.03]
          vols={"below_prior20":u.volume<u.vol20_prior,"above_prior20":u.volume>u.vol20_prior,"none":pd.Series(True,index=u.index)}
          mas={"above200":u.close>u.ma200,"none":pd.Series(True,index=u.index)}
          for rn,rv in rets.items():
            for th in thresholds:
              for vn,vc in vols.items():
                for mn,mc in mas.items():
                  z=u.loc[(rv<=th)&vc&mc,["date"]].copy()
                  z["period"]=np.select([z.date.dt.year<=2016,z.date.dt.year<=2021],["2000-2016","2017-2021"],default="2022-2025")
                  c=z.groupby("period").size(); a=int(c.get("2000-2016",0)); b=int(c.get("2017-2021",0)); h=int(c.get("2022-2025",0))
                  stage3.append({"return_def":rn,"threshold":th,"volume":vn,"ma":mn,"discovery":a,"validation":b,"holdout":h,"total":len(z),"fingerprint_error":abs(a-107)+abs(b-55)+abs(h-18)})
          pd.DataFrame(stage3).sort_values(["fingerprint_error","total"]).to_csv("out/oracle_stage3_grid.csv",index=False)
          # Audit the signal reconstruction before interpreting option outcomes.
          # Export every underlying signal and counts by research split/year.
          aud=u.loc[u.signal,["date","close","volume","ma200","vol20_prior","ret5"]].copy()
          aud["period"]=np.select([aud.date.dt.year<=2016,aud.date.dt.year<=2021],["2000-2016","2017-2021"],default="2022-2025")
          aud.to_csv("out/oracle_all_underlying_signals.csv",index=False)
          aud.groupby("period").size().rename("n").reset_index().to_csv("out/oracle_signal_counts_by_period.csv",index=False)
          aud.assign(year=aud.date.dt.year).groupby("year").size().rename("n").reset_index().to_csv("out/oracle_signal_counts_by_year.csv",index=False)
          sigidx=u.index[u.signal]
          trades=[]
          for i in sigidx:
              if i+2>=len(u): continue
              sd,ed,xd=u.loc[i,"date"],u.loc[i+1,"date"],u.loc[i+2,"date"]
              if ed.year<2008 or ed>pd.Timestamp("2025-08-29"): continue
              trades.append((sd,ed,xd,float(u.loc[i,"close"]),float(u.loc[i+1,"close"]),float(u.loc[i+2,"close"])))
          t=pd.DataFrame(trades,columns=["signal_date","entry_date","exit_date","signal_close","entry_underlying_close","exit_underlying_close"])
          t.to_csv("out/oracle_signal_schedule.csv",index=False)

          years=sorted(set(t.entry_date.dt.year)|set(t.exit_date.dt.year))
          chains={}
          for y in years:
              r=requests.get(BASE.format(y),timeout=180); r.raise_for_status()
              d=pd.read_parquet(io.BytesIO(r.content))
              d["date"]=pd.to_datetime(d.date); d["expiration"]=pd.to_datetime(d.expiration)
              d=d[d["date"].isin(set(t.entry_date)|set(t.exit_date))].copy()
              chains[y]=d
          allc=pd.concat(chains.values(),ignore_index=True)

          specs=[
            ("O1_ATM_2_3DTE",.50,2,3),("O2_D40_2_3DTE",.40,2,3),("O3_D25_2_3DTE",.25,2,3),
            ("O4_ATM_7_10DTE",.50,7,10),("O5_D40_7_10DTE",.40,7,10),("O6_D25_7_10DTE",.25,7,10)]
          rows=[]
          for tr in t.itertuples(index=False):
              ent=allc[(allc.date==tr.entry_date)&(allc.type=="call")].copy()
              for name,target,lo,hi in specs:
                  q=ent.copy(); q["dte"]=(q.expiration-q.date).dt.days
                  q=q[(q.dte>=lo)&(q.dte<=hi)&q.delta.notna()&(q.ask>0)]
                  if q.empty:
                      rows.append({**tr._asdict(),"spec":name,"status":"no_entry_contract"}); continue
                  q["dist"]=(q.delta-target).abs()
                  e=q.sort_values(["dist","ask"]).iloc[0]
                  ex=allc[(allc.date==tr.exit_date)&(allc.contract_id==e.contract_id)]
                  if ex.empty or not np.isfinite(ex.iloc[0].bid):
                      rows.append({**tr._asdict(),"spec":name,"status":"no_exit_quote","contract_id":e.contract_id}); continue
                  x=ex.iloc[0]; entry=float(e.ask); exitp=float(x.bid)
                  ret=exitp/entry-1 if entry>0 else np.nan
                  rows.append({**tr._asdict(),"spec":name,"status":"ok","contract_id":e.contract_id,
                    "expiration":e.expiration,"strike":e.strike,"entry_delta":e.delta,"entry_bid":e.bid,"entry_ask":entry,
                    "exit_bid":exitp,"exit_ask":x.ask,"option_return":ret,
                    "underlying_return_entry_to_exit":tr.exit_underlying_close/tr.entry_underlying_close-1})
          r=pd.DataFrame(rows); r.to_csv("out/oracle_o1_o6_trades.csv",index=False)
          ok=r[r.status=="ok"].copy()
          if len(ok):
              ok["period"]=np.select([ok.entry_date.dt.year<=2016,ok.entry_date.dt.year<=2021],
                                     ["2008-2016","2017-2021"],default="2022-2025")
              def stats(g):
                  rr=g.option_return.dropna()
                  wealth=(1+rr).cumprod(); dd=wealth/wealth.cummax()-1
                  return pd.Series({"n":len(rr),"win_rate":(rr>0).mean(),"mean_return":rr.mean(),"median_return":rr.median(),
                    "avg_winner":rr[rr>0].mean(),"avg_loser":rr[rr<=0].mean(),"best":rr.max(),"worst":rr.min(),
                    "compound_return":wealth.iloc[-1]-1 if len(wealth) else np.nan,"max_drawdown":dd.min() if len(dd) else np.nan,
                    "mean_underlying_return":g.underlying_return_entry_to_exit.mean()})
              summary=pd.concat([
                ok.groupby(["spec","period"],sort=False).apply(stats,include_groups=False).reset_index(),
                ok.groupby("spec",sort=False).apply(stats,include_groups=False).reset_index().assign(period="FULL")
              ],ignore_index=True)
              summary.to_csv("out/oracle_o1_o6_summary.csv",index=False)
          with open("out/README.txt","w") as f:
              f.write("FROZEN EXECUTION: signal at T0 close; enter T+1 EOD at ask; exit T+2 EOD at bid.\n")
              f.write("O1/O4 ATM operationalized as call delta closest to 0.50; O2/O5 closest 0.40; O3/O6 closest 0.25.\n")
              f.write("DTE is calendar days at entry. No rules changed after option outcomes.\n")
          PY
          python /tmp/oracle.py
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-o1-o6-results
          path: out/
          retention-days: 7
