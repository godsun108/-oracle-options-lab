name: Oracle Options Extract
on:
  push:
    paths: ['.github/workflows/oracle-extract.yml']
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --upgrade pandas pyarrow requests numpy
      - name: Run frozen Oracle II O1-O6 EOD backtest
        shell: bash
        run: |
          cat > /tmp/oracle.py <<'PY'
          import io, os, requests, pandas as pd, numpy as np
          BASE="https://raw.githubusercontent.com/anahatsingh-ui/options-dataset-hist/main/spy/options_{}.parquet"
          U="https://raw.githubusercontent.com/OStochastic/Daily-SPY-data-from-2000-2025/main/spy_data.csv"
          os.makedirs("out",exist_ok=True)

          # Underlying signal: Oracle II Candidate #1, frozen before option outcomes.
          u=pd.read_csv(io.StringIO(requests.get(U,timeout=60).text),skiprows=[1,2])
          u.columns=["date","close","high","low","open","volume"]
          u["date"]=pd.to_datetime(u.date); u=u.sort_values("date").reset_index(drop=True)
          u["ma200"]=u.close.rolling(200).mean()
          u["vol20_prior"]=u.volume.shift(1).rolling(20).mean()
          u["ret5"]=u.close.pct_change(5)
          u["signal"]=(u.ret5<=-.02)&(u.close>u.ma200)&(u.volume<u.vol20_prior)
          # Reconstruction diagnostic: compare plausible interpretations of "5-session decline".
          # This does NOT alter the frozen options test.
          # Stage 7 scientific reset: evaluate hypotheses on DISCOVERY only (2000-2016).
          # The old 107/55/18 fingerprint is retained as historical metadata, not a target,
          # because no original code/signal-date artifact has been recovered to substantiate it.
          u["fwd1"]=u.close.shift(-1)/u.close-1
          u["fwd2"]=u.close.shift(-2)/u.close-1
          u["fwd3"]=u.close.shift(-3)/u.close-1
          u["ret1"]=u.close.pct_change()
          u["sum5ret"]=u.ret1.rolling(5).sum()
          u["prod5ret"]=(1+u.ret1).rolling(5).apply(np.prod,raw=True)-1
          u["drop_from_5d_high"]=u.close/u.close.rolling(5).max()-1
          u["drop_from_prior5_high"]=u.close/u.close.shift(1).rolling(5).max()-1
          u["five_day_low_vs_start"]=u.close/u.close.shift(4)-1
          base=(u.close>u.ma200)&(u.volume<u.vol20_prior)
          variants={
            "pct_change_5":u.ret5<=-.02,
            "sum_5_daily_returns":u.sum5ret<=-.02,
            "compound_5_daily_returns":u.prod5ret<=-.02,
            "drop_from_5d_high":u.drop_from_5d_high<=-.02,
            "drop_from_prior5_high":u.drop_from_prior5_high<=-.02,
            "close_vs_4_sessions_ago":u.five_day_low_vs_start<=-.02,
          }
          audit_rows=[]
          for nm,cond in variants.items():
              z=u.loc[base&cond,["date"]].copy()
              z["period"]=np.select([z.date.dt.year<=2016,z.date.dt.year<=2021],["2000-2016","2017-2021"],default="2022-2025")
              c=z.groupby("period").size()
              audit_rows.append({"variant":nm,"discovery":int(c.get("2000-2016",0)),"validation":int(c.get("2017-2021",0)),"holdout":int(c.get("2022-2025",0)),"total":len(z)})
          pd.DataFrame(audit_rows).to_csv("out/oracle_reconstruction_variants.csv",index=False)

          # Stage 2: isolate volume/MA convention differences against the 107/55/18 fingerprint.
          u["ma200_prior"]=u.close.shift(1).rolling(200).mean()
          u["vol20_including_current"]=u.volume.rolling(20).mean()
          u["vol20_sma_shifted"]=u.volume.rolling(20).mean().shift(1)
          price_conds={"ret5":u.ret5<=-.02,"prior5high":u.drop_from_prior5_high<=-.02}
          ma_conds={"ma200_current":u.close>u.ma200,"ma200_prior":u.close>u.ma200_prior,"no_ma":pd.Series(True,index=u.index)}
          vol_conds={
            "vol_below_prior20":u.volume<u.vol20_prior,
            "vol_below_current20":u.volume<u.vol20_including_current,
            "vol_below_shifted20":u.volume<u.vol20_sma_shifted,
            "vol_above_prior20":u.volume>u.vol20_prior,
            "no_volume":pd.Series(True,index=u.index)}
          stage2=[]
          for pn,pc in price_conds.items():
            for mn,mc in ma_conds.items():
              for vn,vc in vol_conds.items():
                z=u.loc[pc&mc&vc,["date"]].copy()
                z["period"]=np.select([z.date.dt.year<=2016,z.date.dt.year<=2021],["2000-2016","2017-2021"],default="2022-2025")
                c=z.groupby("period").size()
                stage2.append({"price":pn,"ma":mn,"volume":vn,"discovery":int(c.get("2000-2016",0)),"validation":int(c.get("2017-2021",0)),"holdout":int(c.get("2022-2025",0)),"total":len(z),
                  "fingerprint_error":abs(int(c.get("2000-2016",0))-107)+abs(int(c.get("2017-2021",0))-55)+abs(int(c.get("2022-2025",0))-18)})
          pd.DataFrame(stage2).sort_values(["fingerprint_error","total"]).to_csv("out/oracle_stage2_grid.csv",index=False)

          # Discovery-only candidate research. No later-period data are used to select candidates.
          research=[]
          disc=u[u.date.dt.year<=2016].copy()
          for p in range(2,11):
            rr=disc.close.pct_change(p)
            for th in [-.01,-.0125,-.015,-.0175,-.02,-.0225,-.025,-.03,-.035,-.04]:
              for vname,vcond in [("below",disc.volume<disc.vol20_prior),("above",disc.volume>disc.vol20_prior),("none",pd.Series(True,index=disc.index))]:
                mask=(rr<=th)&(disc.close>disc.ma200)&vcond
                x=disc.loc[mask]
                n=len(x)
                if n<20: continue
                for h in [1,2,3]:
                  vals=x[f"fwd{h}"].dropna()
                  if len(vals)<20: continue
                  mean=float(vals.mean()); sd=float(vals.std(ddof=1)); se=sd/np.sqrt(len(vals)) if sd>0 else np.nan
                  t=mean/se if se and np.isfinite(se) else np.nan
                  research.append({"periods":p,"threshold":th,"volume":vname,"horizon":h,"n":len(vals),"win_rate":float((vals>0).mean()),"mean_return":mean,"median_return":float(vals.median()),"t_stat":t})
          research_df=pd.DataFrame(research).sort_values(["t_stat","n"],ascending=[False,False])
          research_df.to_csv("out/oracle_stage7_discovery_only.csv",index=False)

          # Stage 8: preregister a compact family from discovery, then evaluate unchanged
          # on validation and locked holdout. Candidates are chosen only from discovery results.
          # Use top distinct rule families to reduce multiple-testing/cherry-picking risk.
          cand=research_df.drop_duplicates(["periods","threshold","volume","horizon"]).head(12).copy()
          eval_rows=[]
          for _,c in cand.iterrows():
            p=int(c.periods); th=float(c.threshold); vol=str(c.volume); h=int(c.horizon)
            rr=u.close.pct_change(p)
            vc=(u.volume<u.vol20_prior) if vol=="below" else ((u.volume>u.vol20_prior) if vol=="above" else pd.Series(True,index=u.index))
            mask=(rr<=th)&(u.close>u.ma200)&vc
            for period_name,pmask in [
              ("discovery",u.date.dt.year<=2016),
              ("validation",(u.date.dt.year>=2017)&(u.date.dt.year<=2021)),
              ("holdout",(u.date.dt.year>=2022)&(u.date<=pd.Timestamp("2025-08-29")))]:
              vals=u.loc[mask&pmask,f"fwd{h}"].dropna()
              eval_rows.append({"periods":p,"threshold":th,"volume":vol,"horizon":h,"sample":period_name,
                "n":len(vals),"win_rate":float((vals>0).mean()) if len(vals) else np.nan,
                "mean_return":float(vals.mean()) if len(vals) else np.nan,
                "median_return":float(vals.median()) if len(vals) else np.nan})
          pd.DataFrame(eval_rows).to_csv("out/oracle_stage8_validation.csv",index=False)

          # Stage 3: test threshold/operator conventions without touching option outcomes.
          stage3=[]
          rets={"ret4":u.close.pct_change(4),"ret5":u.close.pct_change(5),"ret6":u.close.pct_change(6)}
          thresholds=[-.01,-.0125,-.015,-.0175,-.02,-.0225,-.025,-.03]
          vols={"below_prior20":u.volume<u.vol20_prior,"above_prior20":u.volume>u.vol20_prior,"none":pd.Series(True,index=u.index)}
          mas={"above200":u.close>u.ma200,"none":pd.Series(True,index=u.index)}
          for rn,rv in rets.items():
            for th in thresholds:
              for vn,vc in vols.items():
                for mn,mc in mas.items():
                  z=u.loc[(rv<=th)&vc&mc,["date"]].copy()
                  z["period"]=np.select([z.date.dt.year<=2016,z.date.dt.year<=2021],["2000-2016","2017-2021"],default="2022-2025")
                  c=z.groupby("period").size(); a=int(c.get("2000-2016",0)); b=int(c.get("2017-2021",0)); h=int(c.get("2022-2025",0))
                  stage3.append({"return_def":rn,"threshold":th,"volume":vn,"ma":mn,"discovery":a,"validation":b,"holdout":h,"total":len(z),"fingerprint_error":abs(a-107)+abs(b-55)+abs(h-18)})
          pd.DataFrame(stage3).sort_values(["fingerprint_error","total"]).to_csv("out/oracle_stage3_grid.csv",index=False)
          # Stage 4: refine around the best Stage-3 family WITHOUT using option outcomes.
          # Target is only the documented 107/55/18 signal-count fingerprint.
          stage4=[]
          for n in range(3,9):
            rr=u.close.pct_change(n)
            for th in np.arange(-0.035,-0.0149,0.0005):
              for volname,vc in {"above_prior20":u.volume>u.vol20_prior,"below_prior20":u.volume<u.vol20_prior,"none":pd.Series(True,index=u.index)}.items():
                for maname,mc in {"above200":u.close>u.ma200,"above200prior":u.close>u.ma200_prior}.items():
                  z=u.loc[(rr<=th)&vc&mc,["date"]].copy()
                  z["period"]=np.select([z.date.dt.year<=2016,z.date.dt.year<=2021],["2000-2016","2017-2021"],default="2022-2025")
                  c=z.groupby("period").size()
                  d0,d1,d2=int(c.get("2000-2016",0)),int(c.get("2017-2021",0)),int(c.get("2022-2025",0))
                  stage4.append({"periods":n,"threshold":round(float(th),4),"volume":volname,"ma":maname,
                    "discovery":d0,"validation":d1,"holdout":d2,"total":len(z),
                    "fingerprint_error":abs(d0-107)+abs(d1-55)+abs(d2-18)})
          pd.DataFrame(stage4).sort_values(["fingerprint_error","total"]).to_csv("out/oracle_stage4_grid.csv",index=False)

          # Stage 5: test whether the historical fingerprint used NON-overlapping event episodes
          # rather than counting every qualifying day in a multi-day cluster.
          stage5=[]
          target=(107,55,18)
          for periods in range(3,9):
            rr=u.close/u.close.shift(periods)-1
            for thr in np.arange(-.035,-.0099,.0005):
              raw=(rr<=thr)&(u.close>u.ma200)&(u.volume>u.vol20_prior)
              idx=np.flatnonzero(raw.fillna(False).to_numpy())
              for cooldown in range(0,11):
                keep=[]; last=-999
                for i in idx:
                  if i-last>cooldown:
                    keep.append(i); last=i
                z=u.iloc[keep][["date"]].copy()
                z["period"]=np.select([z.date.dt.year<=2016,z.date.dt.year<=2021],["2000-2016","2017-2021"],default="2022-2025")
                c=z.groupby("period").size()
                vals=(int(c.get("2000-2016",0)),int(c.get("2017-2021",0)),int(c.get("2022-2025",0)))
                err=sum(abs(a-b) for a,b in zip(vals,target))
                stage5.append({"periods":periods,"threshold":round(float(thr),4),"cooldown_sessions":cooldown,"discovery":vals[0],"validation":vals[1],"holdout":vals[2],"total":sum(vals),"fingerprint_error":err})
          pd.DataFrame(stage5).sort_values(["fingerprint_error","total"]).to_csv("out/oracle_stage5_episode_grid.csv",index=False)

          # Stage 6: test whether the historical count fingerprint used non-overlapping signal episodes.
          # Keep the economic filters fixed; vary episode definition only.
          stage6=[]
          target=(107,55,18)
          for periods in range(3,11):
            rr=u.close/u.close.shift(periods)-1
            for thr in np.arange(-.035,-.0099,.0005):
              raw=(rr<=thr)&(u.close>u.ma200)&(u.volume>u.vol20_prior)
              idx=np.flatnonzero(raw.fillna(False).to_numpy())
              for episode_gap in range(1,16):
                keep=[]
                last=-10**9
                for i in idx:
                  if i-last>episode_gap:
                    keep.append(i); last=i
                z=u.iloc[keep][["date"]].copy()
                z["period"]=np.select([z.date.dt.year<=2016,z.date.dt.year<=2021],["2000-2016","2017-2021"],default="2022-2025")
                c=z.groupby("period").size()
                vals=(int(c.get("2000-2016",0)),int(c.get("2017-2021",0)),int(c.get("2022-2025",0)))
                err=sum(abs(a-b) for a,b in zip(vals,target))
                stage6.append({"periods":periods,"threshold":round(float(thr),4),"episode_gap":episode_gap,"discovery":vals[0],"validation":vals[1],"holdout":vals[2],"total":len(z),"fingerprint_error":err})
          pd.DataFrame(stage6).sort_values(["fingerprint_error","total"]).to_csv("out/oracle_stage6_episode_grid.csv",index=False)
          # Stage 9: freeze the Stage-7 lead rule and correct the options execution engine.
          # Signal: 6-session return <= -1%, close > 200DMA. No volume filter.
          # Options: signal T0 close; enter T+1 EOD ask; exit T+2 EOD bid.
          u["stage9_signal"]=(u.close.pct_change(6)<=-.01)&(u.close>u.ma200)
          aud=u.loc[u.stage9_signal,["date","close","volume","ma200"]].copy()
          aud["ret6"]=u.close.pct_change(6).loc[u.stage9_signal]
          aud["period"]=np.select([aud.date.dt.year<=2016,aud.date.dt.year<=2021],["2000-2016","2017-2021"],default="2022-2025")
          aud.to_csv("out/oracle_stage9_signals.csv",index=False)

          sigidx=u.index[u.stage9_signal]
          trades=[]
          for i in sigidx:
              if i+2>=len(u): continue
              sd,ed,xd=u.loc[i,"date"],u.loc[i+1,"date"],u.loc[i+2,"date"]
              if ed.year<2008 or ed>pd.Timestamp("2025-08-29"): continue
              trades.append((sd,ed,xd,float(u.loc[i,"close"]),float(u.loc[i+1,"close"]),float(u.loc[i+2,"close"])))
          t=pd.DataFrame(trades,columns=["signal_date","entry_date","exit_date","signal_close_adjusted","entry_close_adjusted","exit_close_adjusted"])
          t.to_csv("out/oracle_stage9_signal_schedule.csv",index=False)

          # Unadjusted underlying prices from the same options-data repository establish ATM strike scale.
          UP="https://raw.githubusercontent.com/anahatsingh-ui/options-dataset-hist/main/spy/underlying_prices.parquet"
          pr=requests.get(UP,timeout=180); pr.raise_for_status()
          spot=pd.read_parquet(io.BytesIO(pr.content))
          # Normalize common schema variants without silently using adjusted signal prices for ATM.
          spot.columns=[str(c).lower() for c in spot.columns]
          if "date" not in spot.columns: raise ValueError("underlying_prices.parquet has no date column")
          spot["date"]=pd.to_datetime(spot.date)
          if "symbol" in spot.columns: spot=spot[spot.symbol.astype(str).str.upper()=="SPY"]
          closecol=next((c for c in ["close","underlying_close","price","last"] if c in spot.columns),None)
          if closecol is None: raise ValueError("No usable unadjusted close column: "+str(list(spot.columns)))
          smap=spot.drop_duplicates("date").set_index("date")[closecol]
          t["entry_spot_unadjusted"]=t.entry_date.map(smap)
          t["exit_spot_unadjusted"]=t.exit_date.map(smap)

          years=sorted(set(t.entry_date.dt.year)|set(t.exit_date.dt.year))
          chains=[]
          wanted=set(t.entry_date)|set(t.exit_date)
          for y in years:
              rr=requests.get(BASE.format(y),timeout=180); rr.raise_for_status()
              d=pd.read_parquet(io.BytesIO(rr.content))
              d["date"]=pd.to_datetime(d.date); d["expiration"]=pd.to_datetime(d.expiration)
              chains.append(d[d.date.isin(wanted)].copy())
          allc=pd.concat(chains,ignore_index=True)

          specs=[("O1_ATM_2_3DTE","atm",2,3),("O2_D40_2_3DTE",.40,2,3),("O3_D25_2_3DTE",.25,2,3),
                 ("O4_ATM_7_10DTE","atm",7,10),("O5_D40_7_10DTE",.40,7,10),("O6_D25_7_10DTE",.25,7,10)]
          rows=[]
          for tr in t.itertuples(index=False):
              ent=allc[(allc.date==tr.entry_date)&(allc.type.astype(str).str.lower()=="call")].copy()
              for name,target,lo,hi in specs:
                  q=ent.copy(); q["dte"]=(q.expiration-q.date).dt.days
                  q=q[(q.dte>=lo)&(q.dte<=hi)&(q.bid>0)&(q.ask>0)&(q.ask>=q.bid)]
                  if target!="atm": q=q[q.delta.notna()]
                  if q.empty:
                      rows.append({**tr._asdict(),"spec":name,"status":"no_valid_entry_contract"}); continue
                  if target=="atm":
                      if not np.isfinite(tr.entry_spot_unadjusted):
                          rows.append({**tr._asdict(),"spec":name,"status":"missing_unadjusted_spot"}); continue
                      q["dist"]=(q.strike-tr.entry_spot_unadjusted).abs()
                  else: q["dist"]=(q.delta-float(target)).abs()
                  q["oi_sort"]=pd.to_numeric(q.open_interest,errors="coerce").fillna(-1)
                  q["spread"]=q.ask-q.bid
                  q["cid_sort"]=q.contract_id.astype(str)
                  e=q.sort_values(["dist","oi_sort","spread","cid_sort"],ascending=[True,False,True,True]).iloc[0]
                  ex=allc[(allc.date==tr.exit_date)&(allc.contract_id==e.contract_id)].copy()
                  ex=ex[(ex.bid>0)&(ex.ask>0)&(ex.ask>=ex.bid)]
                  if ex.empty:
                      rows.append({**tr._asdict(),"spec":name,"status":"no_valid_exit_quote","contract_id":e.contract_id}); continue
                  x=ex.sort_values("contract_id").iloc[0]
                  entry=float(e.ask); exitp=float(x.bid); pnl=(exitp-entry)*100.; ret=(exitp-entry)/entry
                  rows.append({**tr._asdict(),"spec":name,"status":"ok","contract_id":e.contract_id,
                    "expiration":e.expiration,"dte":int(e.dte),"strike":float(e.strike),"entry_delta":e.delta,
                    "entry_bid":float(e.bid),"entry_ask":entry,"entry_open_interest":e.open_interest,
                    "exit_bid":exitp,"exit_ask":float(x.ask),"option_return":ret,"one_contract_pnl":pnl})
          res=pd.DataFrame(rows); res.to_csv("out/oracle_stage9_options_trades.csv",index=False)

          attempts=res.groupby("spec").size().rename("n_attempted")
          eligible=res[res.status=="ok"].groupby("spec").size().rename("n_eligible")
          missing=res[res.status!="ok"].groupby(["spec","status"]).size().rename("n").reset_index()
          missing.to_csv("out/oracle_stage9_missing_reasons.csv",index=False)
          ok=res[res.status=="ok"].copy()
          if len(ok):
              ok["period"]=np.select([ok.entry_date.dt.year<=2016,ok.entry_date.dt.year<=2021],["2008-2016","2017-2021"],default="2022-2025")
              def stat(g):
                  rr=g.option_return; pp=g.one_contract_pnl
                  cum=pp.cumsum(); peak=np.maximum.accumulate(np.r_[0.0,cum.to_numpy()]); dd=cum.to_numpy()-peak[1:]
                  return pd.Series({"n_eligible":len(g),"win_rate":float((pp>0).mean()),"mean_return":rr.mean(),"median_return":rr.median(),
                    "avg_winner":rr[pp>0].mean(),"avg_loser":rr[pp<=0].mean(),"best_return":rr.max(),"worst_return":rr.min(),
                    "total_one_contract_pnl":pp.sum(),"max_drawdown_dollars":dd.min() if len(dd) else np.nan})
              summary=pd.concat([ok.groupby(["spec","period"],sort=False).apply(stat,include_groups=False).reset_index(),
                ok.groupby("spec",sort=False).apply(stat,include_groups=False).reset_index().assign(period="FULL")],ignore_index=True)
              summary=summary.merge(attempts,on="spec",how="left")
              summary.to_csv("out/oracle_stage9_options_summary.csv",index=False)
          with open("out/STAGE9_README.txt","w") as fh:
              fh.write("Stage 9 freezes lead Stage-7 rule: 6-session return <= -1%, close above 200DMA, no volume filter.\n")
              fh.write("Corrected options methodology: T+1 EOD ask to T+2 EOD bid; ATM by strike vs unadjusted SPY spot; delta variants by target delta; strict valid quotes; OI/spread/contract-id tie breaks; one-contract dollar P&L drawdown.\n")
          PY
          python /tmp/oracle.py
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-o1-o6-results
          path: out/
          retention-days: 7
