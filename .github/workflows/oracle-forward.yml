name: Oracle Forward Observation
on:
  workflow_dispatch:
  schedule:
    # Weekdays after the US market close. The source may publish later; stale-cutoff
    # observations remain explicit rather than being silently treated as current.
    - cron: '30 22 * * 1-5'

permissions:
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas requests
      - name: Generate prospective observation
        run: |
          mkdir -p forward_records
          record="$(python -m oracle_q.observe)"
          printf '%s\n' "$record" | tee /tmp/record.json
          date="$(python -c 'import json; print(json.load(open("/tmp/record.json"))["signal_date"])')"
          path="forward_records/$date.json"
          if [ -e "$path" ]; then
            echo "Record already exists for $date; refusing silent overwrite."
            diff -u "$path" /tmp/record.json || true
            exit 0
          fi
          cp /tmp/record.json "$path"
      - name: Commit immutable observation
        run: |
          if git diff --quiet -- forward_records; then exit 0; fi
          git config user.name "oracle-forward-bot"
          git config user.email "oracle-forward-bot@users.noreply.github.com"
          git add forward_records
          git commit -m "Forward observation $(date -u +%F)"
          git push
