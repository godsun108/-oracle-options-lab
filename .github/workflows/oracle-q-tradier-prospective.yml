name: Oracle-Q Tradier Prospective Observation
on:
  workflow_dispatch:
  schedule:
    - cron: '45 22 * * 1-5'
  push:
    paths:
      - "oracle_q/prospective_options.py"
      - "oracle_q/underlying_provider.py"
      - "oracle_q/seldon_sidecar.py"
      - "tests/test_seldon_sidecar.py"
      - "oracle_q_prospective_tradier.py"
      - "tests/test_prospective_options.py"
      - ".github/workflows/oracle-q-tradier-prospective.yml"
permissions:
  contents: write
jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas requests pytest
      - name: Unit guardrails
        run: python -m pytest -q tests/test_options_provider.py tests/test_prospective_options.py tests/test_underlying_provider.py tests/test_seldon_sidecar.py
      - name: Download latest successful Seldon prospective artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p seldon_artifact
          run_id="$(gh run list -R godsun108/Seldon --workflow prospective-macro-v1.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -n "$run_id" ]; then
            gh run download "$run_id" -R godsun108/Seldon -n seldon-prospective-macro-v1 -D seldon_artifact
          else
            echo "No successful Seldon prospective artifact found; Oracle will record MISSING."
          fi
      - name: Prospective read-only observation
        env:
          TRADIER_PRODUCTION_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: |
          mkdir -p prospective_records
          python oracle_q_prospective_tradier.py | tee /tmp/evidence.log
          sed 's/^ORACLE FORWARD EVIDENCE //' /tmp/evidence.log > /tmp/evidence.json
          python -m json.tool /tmp/evidence.json >/dev/null
          date="$(python -c 'import json; print(json.load(open("/tmp/evidence.json"))["canonical_signal"]["signal_date"])')"
          path="prospective_records/$date.json"
          if [ -e "$path" ]; then
            echo "Prospective record already exists for $date; refusing silent overwrite."
            diff -u "$path" /tmp/evidence.json || true
            exit 0
          fi
          cp /tmp/evidence.json "$path"
      - name: Commit immutable prospective evidence
        run: |
          if git diff --quiet -- prospective_records && [ -z "$(git ls-files --others --exclude-standard prospective_records)" ]; then exit 0; fi
          git config user.name "oracle-prospective-bot"
          git config user.email "oracle-prospective-bot@users.noreply.github.com"
          git add prospective_records
          git commit -m "Prospective Oracle-Q evidence $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
