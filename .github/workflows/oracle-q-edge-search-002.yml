name: Oracle Q Edge Search Batch 002
on:
  workflow_dispatch:
  push:
    paths:
      - "oracle_q/edge_search_batch_002.py"
      - ".github/workflows/oracle-q-edge-search-002.yml"
jobs:
  schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install numpy
      - run: python -m oracle_q.edge_search_batch_002
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-q-edge-search-batch-002
          path: out/oracle_q_batch_002_manifest.json
