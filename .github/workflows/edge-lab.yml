name: Multi-market edge research lab (paper only)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/edge-lab.yml'
      - 'research/edge_evidence_restore.py'
      - 'tests/test_edge_evidence_restore.py'
      - 'research/edge_session_calendar.py'
      - 'research/edge_session_calendar.json'
      - 'tests/test_edge_session_calendar.py'
      - 'research/edge_execution_sensitivity.py'
      - 'tests/test_edge_execution_sensitivity.py'
      - 'research/edge_source_replay.py'
      - 'tests/test_edge_source_replay.py'
      - 'research/edge_lab.py'
      - 'research/edge_history_diagnostic.py'
      - 'tests/test_edge_history_diagnostic.py'
      - 'research/edge_forward_paper.py'
      - 'research/edge_forward_scorecard.py'
      - 'research/edge_forward_uncertainty.py'
      - 'tests/test_edge_forward_uncertainty.py'
      - 'research/edge_forward_integrity_audit.py'
      - 'tests/test_edge_forward_integrity_audit.py'
      - 'research/edge_regime_context.py'
      - 'tests/test_edge_regime_context.py'
      - 'research/edge_registry.json'
      - 'research/edge_paper_league.py'
      - 'research/league_championships.py'
      - 'research/league_fixtures.py'
      - 'research/league_scoring.py'
      - 'research/league_session_adapter.py'
      - 'research/league_provisional_standings.py'
      - 'research/league_readiness_report.py'
      - 'research/forward_profit_triage.py'
      - 'tests/test_forward_profit_triage.py'
      - 'tests/test_league_provisional_standings.py'
      - 'tests/test_league_readiness_report.py'
      - 'tests/test_league_session_adapter.py'
      - 'tests/test_league_scoring.py'
      - 'tests/test_league_fixtures.py'
      - 'tests/test_league_championships.py'
      - 'research/agent_paper_portfolio.py'
      - 'research/agent_forward_replay.py'
      - 'research/agent_trade_cycles.py'
      - 'tests/test_agent_trade_cycles.py'
      - 'tests/test_agent_forward_replay.py'
      - 'research/edge_paper_league_rules.json'
      - 'tests/test_edge_paper_league.py'
      - 'tests/test_edge_lab.py'
      - 'tests/test_edge_forward_paper.py'
      - 'tests/test_edge_forward_scorecard.py'
  pull_request:
    paths:
      - "research/edge_regime_context.py"
      - "tests/test_edge_regime_context.py"
      - "research/edge_registry.json"
      - "research/edge_paper_league.py"
      - "research/league_championships.py"
      - "research/league_fixtures.py"
      - "research/league_scoring.py"
      - "research/league_session_adapter.py"
      - "research/league_provisional_standings.py"
      - "tests/test_league_provisional_standings.py"
      - "tests/test_league_session_adapter.py"
      - "tests/test_league_scoring.py"
      - "tests/test_league_fixtures.py"
      - "tests/test_league_championships.py"
      - "research/agent_paper_portfolio.py"
      - "research/agent_forward_replay.py"
      - "research/agent_trade_cycles.py"
      - "tests/test_agent_trade_cycles.py"
      - "tests/test_agent_forward_replay.py"
      - "research/edge_paper_league_rules.json"
      - "tests/test_edge_paper_league.py"
      - "research/edge_evidence_restore.py"
      - "tests/test_edge_evidence_restore.py"
      - "research/edge_session_calendar.py"
      - "research/edge_session_calendar.json"
      - "tests/test_edge_session_calendar.py"
      - "research/edge_execution_sensitivity.py"
      - "tests/test_edge_execution_sensitivity.py"
      - "research/edge_source_replay.py"
      - "tests/test_edge_source_replay.py"
      - "research/edge_lab.py"
      - "research/edge_history_diagnostic.py"
      - "tests/test_edge_history_diagnostic.py"
      - "research/edge_forward_paper.py"
      - "research/edge_forward_scorecard.py"
      - "research/forward_profit_triage.py"
      - "tests/test_forward_profit_triage.py"
      - "research/edge_forward_uncertainty.py"
      - "tests/test_edge_forward_uncertainty.py"
      - "research/edge_forward_integrity_audit.py"
      - "tests/test_edge_forward_integrity_audit.py"
      - "tests/test_edge_forward_scorecard.py"
      - "tests/test_edge_forward_paper.py"
      - "tests/test_edge_lab.py"
      - ".github/workflows/edge-lab.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * 1-5"

permissions:
  contents: read
  actions: read

concurrency:
  # PR tests never write production evidence and must not block its queue.
  # All production triggers still share one serialized ledger-writing group.
  group: ${{ github.event_name == 'pull_request' && format('oracle-q-edge-lab-pr-{0}', github.event.pull_request.number) || 'oracle-q-edge-lab' }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify pre-registered edge lab research
        # Diagnostic probes are tested without network access or credentials.
        run: python -m unittest tests.test_edge_paper_league tests.test_edge_regime_context tests.test_edge_history_diagnostic tests.test_edge_source_replay tests.test_edge_lab tests.test_edge_forward_paper tests.test_edge_forward_scorecard tests.test_edge_forward_integrity_audit tests.test_edge_forward_uncertainty tests.test_edge_evidence_restore tests.test_edge_session_calendar tests.test_edge_execution_sensitivity tests.test_agent_paper_portfolio tests.test_agent_forward_replay tests.test_agent_trade_cycles tests.test_league_championships tests.test_league_fixtures tests.test_league_scoring tests.test_league_session_adapter tests.test_league_provisional_standings tests.test_league_readiness_report tests.test_forward_profit_triage -v

  research:
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect fixed-lookback forward inputs with read-only Tradier bars
        id: collect
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python -m research.edge_lab --mode forward --allow-partial --registry research/edge_registry.json --output edge_lab_report.json
      - name: Diagnose rejected historical opens without changing research data
        if: always() && steps.collect.outcome != 'skipped'
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python -m research.edge_history_diagnostic --report edge_lab_report.json --output edge_history_diagnostic.json
      - name: Replay signals from retained source evidence before ledger writes
        run: python -m research.edge_source_replay --report edge_lab_report.json --output edge_source_replay.json --allow-partial
      - name: Restore previous hash-linked forward paper observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.edge_evidence_restore --directory edge-restore
      - name: Append and settle delayed forward paper observations
        run: python -m research.edge_forward_paper --current edge_lab_report.json --prior edge-restore/edge_forward_ledger.json --output edge_forward_ledger.json --allow-partial
      - name: Audit forward ledger chronology and observed-price arithmetic
        run: python -m research.edge_forward_integrity_audit --ledger edge_forward_ledger.json --output edge_forward_integrity_audit.json
      - name: Verify cross-run event prefix continuity
        run: python -m research.edge_evidence_restore --prior edge-restore/edge_forward_ledger.json --current edge_forward_ledger.json --output edge_forward_continuity.json
      - name: Score paired delayed forward paper outcomes
        run: python -m research.edge_forward_scorecard --ledger edge_forward_ledger.json --report edge_lab_report.json --output edge_forward_scorecard.json --allow-partial
      - name: Triage observed net-positive forward paper candidates
        run: python -m research.forward_profit_triage --scorecard edge_forward_scorecard.json --output forward_profit_triage.json
      - name: Stress fixed hypothetical execution costs
        run: python -m research.edge_execution_sensitivity --ledger edge_forward_ledger.json --output edge_execution_sensitivity.json
      - name: Score fixed prospective paper league
        run: python -m research.edge_paper_league --ledger edge_forward_ledger.json --output edge_paper_league.json
      - name: Replay 18 agent paper portfolios from prospective evidence
        run: python -m research.agent_forward_replay --ledger edge_forward_ledger.json --output agent_paper_positions.json
      - name: Reconcile complete simulated trades with decision and price evidence
        run: python -m research.agent_trade_cycles --ledger edge_forward_ledger.json --output agent_trade_cycles.json
      - name: Report comparable sessions from verified 18-agent paper replay
        run: python -m research.league_readiness_report --source agent_paper_positions.json --output league_readiness_report.json
      - name: Summarize research without promoting historical backtests to proven edges
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("edge_lab_report.json")
          data=json.loads(p.read_text()) if p.exists() else {}
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("\n### Oracle-Q multi-market edge lab (read-only)\n")
              f.write("Historical backtests are not forward paper performance or verified edges.\n")
              f.write("This workflow collects exactly 200 sessions for unchanged forward signals; it does not rerun the long historical backtest. Known older history defects are not repaired.\n")
              for r in data.get("reports",[]):
                  f.write(f"- {r.get('symbol')}: {r.get('status')}; bars: {r.get('bars','unavailable')}; diagnostic: {r.get('diagnostic',r.get('source_ohlc_diagnostic',{})).get('reason','none')}\n")
              scorecard=Path("edge_forward_scorecard.json")
              if scorecard.exists():
                  sc=json.loads(scorecard.read_text())
                  f.write(f"Forward scorecard: {sc.get('outcomes_total',0)} settled observations across {len(sc.get('pairs',[]))} strategy-market pairs; excluded untimed signals: {sc.get('signals_excluded_timing',0)}.\\n")
                  f.write(f"Collection health: {sc.get('collection_health','UNKNOWN')}; blocked markets: {sc.get('blocked_markets',[])}\n")
                  for pair in sc.get("pairs",[]):
                      f.write(f"- {pair['symbol']} / {pair['strategy_id']}: {pair['outcomes_observed']} settled, {pair['pending']} pending, {pair.get('signals_excluded_timing',0)} excluded for missing timing; status: {pair['status']}\\n")
                  f.write("\nIndividual candidate review (not live approval):\n")
                  for pair in sc.get("pairs",[]):
                      review=pair.get("candidate_review",{})
                      f.write(f"- {pair['symbol']} / {pair['strategy_id']}: {review.get('status','UNAVAILABLE')}; unmet checks: {', '.join(review.get('unmet_research_checks',[])) or 'none; manual research review required'}\n")
              league_path=Path("edge_paper_league.json")
              if league_path.exists():
                  league=json.loads(league_path.read_text())
                  f.write(f"\nPaper league: {league['season_id']}; fixed window {league['first_entry_session']} to {league['last_exit_session']}; no certified profitable team.\n")
                  for team in league['teams']:
                      f.write(f"- {team['team']}: {team['status']}; {team['completed_common_sessions']}/{team['required_sessions']} common sessions\n")
              audit_path=Path("edge_forward_integrity_audit.json")
              if audit_path.exists():
                  integrity=json.loads(audit_path.read_text())
                  f.write(f"Forward integrity audit: {integrity.get('status','MISSING')} | outcomes: {integrity.get('forward_outcomes',0)} | excluded: {integrity.get('excluded_legacy_signals',0)}\\n")
              ledger_path=Path("edge_forward_ledger.json")
              if ledger_path.exists():
                  paper=json.loads(ledger_path.read_text())
                  f.write(f"Hash-linked source open checkpoints: {paper.get('open_checkpoints_recorded','legacy ledger')}\\n")
              cycles_path=Path("agent_trade_cycles.json")
              if cycles_path.exists():
                  cycles=json.loads(cycles_path.read_text())
                  f.write(f"\nReconciled simulated trades: {cycles['closed_trade_count']} closed; {cycles['open_trade_count']} open. Full decision, entry, exit and cost evidence: agent_trade_cycles.json.\n")
              f.write("Orders: DISABLED | Real fills: NONE | Proven profitability: NO\n")
          PY
      - name: Retain research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-edge-lab-${{ github.run_id }}
          path: |
            edge_lab_report.json
            edge_history_diagnostic.json
            edge_source_replay.json
            edge_forward_ledger.json
            edge_forward_scorecard.json
            edge_forward_integrity_audit.json
            edge_execution_sensitivity.json
            edge_paper_league.json
            agent_paper_positions.json
            agent_trade_cycles.json
            league_readiness_report.json
            forward_profit_triage.json
            research/edge_paper_league_rules.json
            edge_forward_continuity.json
            edge-restore/edge_restore_manifest.json
          if-no-files-found: warn
          retention-days: 30
