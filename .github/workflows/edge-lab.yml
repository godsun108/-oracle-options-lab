name: Multi-market edge research lab (paper only)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/edge-lab.yml'
      - 'research/edge_lab.py'
      - 'research/edge_forward_paper.py'
      - 'research/edge_forward_scorecard.py'
      - 'research/edge_forward_uncertainty.py'
      - 'tests/test_edge_forward_uncertainty.py'
      - 'research/edge_forward_integrity_audit.py'
      - 'tests/test_edge_forward_integrity_audit.py'
      - 'research/edge_registry.json'
      - 'tests/test_edge_lab.py'
      - 'tests/test_edge_forward_paper.py'
      - 'tests/test_edge_forward_scorecard.py'
  pull_request:
    paths:
      - "research/edge_registry.json"
      - "research/edge_lab.py"
      - "research/edge_forward_paper.py"
      - "research/edge_forward_scorecard.py"
      - "research/edge_forward_uncertainty.py"
      - "tests/test_edge_forward_uncertainty.py"
      - "research/edge_forward_integrity_audit.py"
      - "tests/test_edge_forward_integrity_audit.py"
      - "tests/test_edge_forward_scorecard.py"
      - "tests/test_edge_forward_paper.py"
      - "tests/test_edge_lab.py"
      - ".github/workflows/edge-lab.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * 1-5"

permissions:
  contents: read
  actions: read

concurrency:
  group: oracle-q-edge-lab
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify pre-registered edge lab research
        run: python -m unittest tests.test_edge_lab tests.test_edge_forward_paper tests.test_edge_forward_scorecard tests.test_edge_forward_integrity_audit tests.test_edge_forward_uncertainty -v

  research:
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Backtest published-edge ETF proxies with read-only Tradier bars
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python -m research.edge_lab --registry research/edge_registry.json --output edge_lab_report.json
      - name: Restore previous hash-linked forward paper observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p edge-restore
          PREVIOUS=$(gh run list --repo "${{ github.repository }}" --workflow edge-lab.yml --branch main --status success --limit 30 --json databaseId --jq '.[].databaseId' | while read -r id; do
            if [ "$id" != "${{ github.run_id }}" ]; then
              if gh api "repos/${{ github.repository }}/actions/runs/$id/artifacts" --jq '.artifacts[].name' | grep -Fxq "oracle-edge-lab-$id"; then
                echo "$id"
                break
              fi
            fi
          done)
          if [ -n "$PREVIOUS" ]; then
            gh run download "$PREVIOUS" --repo "${{ github.repository }}" --name "oracle-edge-lab-$PREVIOUS" --dir edge-restore
            if [ -s edge-restore/edge_forward_ledger.json ]; then
              echo "Restored forward paper ledger from $PREVIOUS"
            else
              echo "Prior edge report predates forward ledger; starting ledger genesis"
            fi
          else
            echo "No prior successful edge lab artifact; starting ledger genesis"
          fi
      - name: Append and settle delayed forward paper observations
        run: python -m research.edge_forward_paper --current edge_lab_report.json --prior edge-restore/edge_forward_ledger.json --output edge_forward_ledger.json
      - name: Audit forward ledger chronology and observed-price arithmetic
        run: python -m research.edge_forward_integrity_audit --ledger edge_forward_ledger.json --output edge_forward_integrity_audit.json
      - name: Score paired delayed forward paper outcomes
        run: python -m research.edge_forward_scorecard --ledger edge_forward_ledger.json --report edge_lab_report.json --output edge_forward_scorecard.json
      - name: Summarize research without promoting historical backtests to proven edges
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("edge_lab_report.json")
          data=json.loads(p.read_text()) if p.exists() else {}
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("\n### Oracle-Q multi-market edge lab (read-only)\n")
              f.write("Historical backtests are not forward paper performance or verified edges.\n")
              for r in data.get("reports",[]):
                  f.write(f"- {r.get('symbol')}: {r.get('status')}; bars: {r.get('bars','unavailable')}; diagnostic: {r.get('diagnostic',r.get('source_ohlc_diagnostic',{})).get('reason','none')}\n")
              scorecard=Path("edge_forward_scorecard.json")
              if scorecard.exists():
                  sc=json.loads(scorecard.read_text())
                  f.write(f"Forward scorecard: {sc.get('outcomes_total',0)} settled observations across {len(sc.get('pairs',[]))} strategy-market pairs; excluded untimed signals: {sc.get('signals_excluded_timing',0)}.\\n")
                  for pair in sc.get("pairs",[]):
                      f.write(f"- {pair['symbol']} / {pair['strategy_id']}: {pair['outcomes_observed']} settled, {pair['pending']} pending, {pair.get('signals_excluded_timing',0)} excluded for missing timing; status: {pair['status']}\\n")
              audit_path=Path("edge_forward_integrity_audit.json")
              if audit_path.exists():
                  integrity=json.loads(audit_path.read_text())
                  f.write(f"Forward integrity audit: {integrity.get('status','MISSING')} | outcomes: {integrity.get('forward_outcomes',0)} | excluded: {integrity.get('excluded_legacy_signals',0)}\\n")
              ledger_path=Path("edge_forward_ledger.json")
              if ledger_path.exists():
                  paper=json.loads(ledger_path.read_text())
                  f.write(f"Hash-linked source open checkpoints: {paper.get('open_checkpoints_recorded','legacy ledger')}\\n")
              f.write("Orders: DISABLED | Real fills: NONE | Proven profitability: NO\n")
          PY
      - name: Retain research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-edge-lab-${{ github.run_id }}
          path: |
            edge_lab_report.json
            edge_forward_ledger.json
            edge_forward_scorecard.json
            edge_forward_integrity_audit.json
          if-no-files-found: warn
          retention-days: 30
