name: Multi-market edge research lab (paper only)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/edge-lab.yml'
  pull_request:
    paths:
      - "research/edge_registry.json"
      - "research/edge_lab.py"
      - "tests/test_edge_lab.py"
      - ".github/workflows/edge-lab.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * 1-5"

permissions:
  contents: read

concurrency:
  group: oracle-q-edge-lab
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify pre-registered edge lab research
        run: python -m unittest tests.test_edge_lab -v

  research:
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Backtest published-edge ETF proxies with read-only Tradier bars
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python -m research.edge_lab --registry research/edge_registry.json --output edge_lab_report.json
      - name: Summarize research without promoting historical backtests to proven edges
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("edge_lab_report.json")
          data=json.loads(p.read_text()) if p.exists() else {}
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("\n### Oracle-Q multi-market edge lab (read-only)\n")
              f.write("Historical backtests are not forward paper performance or verified edges.\n")
              for r in data.get("reports",[]):
                  f.write(f"- {r.get('symbol')}: {r.get('status')}; bars: {r.get('bars','unavailable')}; diagnostic: {r.get('diagnostic',r.get('source_ohlc_diagnostic',{})).get('reason','none')}\n")
              f.write("Orders: DISABLED | Real fills: NONE | Proven profitability: NO\n")
          PY
      - name: Retain research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-edge-lab-${{ github.run_id }}
          path: edge_lab_report.json
          if-no-files-found: warn
          retention-days: 30
