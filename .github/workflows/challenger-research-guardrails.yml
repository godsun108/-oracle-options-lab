name: Challenger Research Guardrails
on:
  pull_request:
    paths:
      - 'research/challenger_*.py'
      - 'research/arena_feed.py'
      - 'tests/test_challenger_*.py'
      - 'tests/test_arena_feed.py'
      - '.github/workflows/challenger-research-guardrails.yml'
  workflow_dispatch:
jobs:
  challenger-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest numpy pandas requests scikit-learn
      - run: python -m pytest -q tests/test_challenger_registry.py tests/test_challenger_score.py tests/test_challenger_evidence_bridge.py tests/test_challenger_promotion.py tests/test_arena_feed.py
