name: Multi-market research observer (read only)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/multi-market-observer.yml'
  pull_request:
    paths:
      - "research/paco_tradier_auth_diagnostic.py"
      - "tests/test_paco_tradier_auth_diagnostic.py"
      - "research/paco_spx_history_diagnostic.py"
      - "tests/test_paco_spx_history_diagnostic.py"
      - "research/paco_spx_signal_feed.py"
      - "tests/test_paco_spx_signal_feed.py"
      - "research/paco_signal_gated_audit.py"
      - "tests/test_paco_signal_gated_audit.py"
      - "research/paco_quote_outcome_audit.py"
      - "tests/test_paco_quote_outcome_audit.py"
      - "research/paco_premium_comparison.py"
      - "tests/test_paco_premium_comparison.py"
      - "research/paco_snapshot_continuity.py"
      - "tests/test_paco_snapshot_continuity.py"
      - "research/paco_snapshot_collector.py"
      - "tests/test_paco_snapshot_collector.py"
      - "research/paco_tradier_chains.py"
      - "tests/test_paco_tradier_chains.py"
      - "research/paco_quote_evidence.py"
      - "tests/test_paco_quote_evidence.py"
      - "research/paco_performance_report.py"
      - "tests/test_paco_performance_report.py"
      - "research/paco_paper_ledger.py"
      - "tests/test_paco_paper_ledger.py"
      - "research/paco_oracle_pipeline.py"
      - "tests/test_paco_oracle_pipeline.py"
      - "research/cash_progress_report.py"
      - "tests/test_cash_progress_report.py"
      - "research/options_discount_scanner.py"
      - "tests/test_options_discount_scanner.py"
      - "research/paco_terminator.py"
      - "tests/test_paco_terminator.py"
      - "research/PACO_STRATEGY.md"
      - "research/spx_ath_spy_puts.py"
      - "tests/test_spx_ath_spy_puts.py"
      - "research/multi_market_observer.py"
      - "research/feed_evidence.py"
      - "research/observation_cash_baseline.py"
      - "research/cash_observation_ledger.py"
      - "research/cash_ledger_run_summary.py"
      - "tests/test_cash_ledger_run_summary.py"
      - "tests/test_cash_observation_ledger.py"
      - "tests/test_observation_cash_baseline.py"
      - "research/feed_run_summary.py"
      - "tests/test_feed_run_summary.py"
      - "tests/test_feed_evidence.py"
      - "research/tradier_daily_bars.py"
      - "research/tradier_paper_bridge.py"
      - "tests/test_tradier_paper_bridge.py"
      - "tests/test_tradier_daily_bars.py"
      - "tests/test_multi_market_observer.py"
      - "tests/test_daily_focus.py"
      - "research/daily_focus.py"
      - "research/conditional_paper.py"
      - "tests/test_conditional_paper.py"
      - "research/paper_ledger.py"
      - "tests/test_paper_ledger.py"
      - "research/paper_research_runner.py"
      - "tests/test_paper_research_runner.py"
      - "research/opportunity_dispatch.py"
      - "tests/test_opportunity_dispatch.py"
      - "research/dispatch_outbox.py"
      - "tests/test_dispatch_outbox.py"
      - "research/forward_paper.py"
      - "tests/test_forward_paper.py"
      - "research/persistent_forward_runner.py"
      - "tests/test_persistent_forward_runner.py"
      - "research/paper_state_snapshot.py"
      - "tests/test_paper_state_snapshot.py"
      - ".github/workflows/multi-market-observer.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * 1-5"

permissions:
  contents: read
  actions: read

concurrency:
  group: oracle-q-live-observation-chain
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test multi-day cash progress evidence
        run: python -m unittest tests.test_cash_progress_report -v
      - name: Test PACO Tradier authentication diagnostics
        run: python -m unittest tests.test_paco_tradier_auth_diagnostic -v
      - name: Test PACO SPX history diagnostic
        run: python -m unittest tests.test_paco_spx_history_diagnostic -v
      - name: Test PACO SPX signal feed
        run: python -m unittest tests.test_paco_spx_signal_feed -v
      - name: Test PACO signal-gated research audit
        run: python -m unittest tests.test_paco_signal_gated_audit -v
      - name: Test PACO observational quote outcome audit
        run: python -m unittest tests.test_paco_quote_outcome_audit -v
      - name: Test PACO premium comparison
        run: python -m unittest tests.test_paco_premium_comparison -v
      - name: Test PACO cross-run snapshot continuity
        run: python -m unittest tests.test_paco_snapshot_continuity -v
      - name: Test PACO scheduled snapshot collector
        run: python -m unittest tests.test_paco_snapshot_collector -v
      - name: Test PACO Tradier read-only options chain adapter
        run: python -m unittest tests.test_paco_tradier_chains -v
      - name: Test PACO option quote evidence gate
        run: python -m unittest tests.test_paco_quote_evidence -v
      - name: Test PACO hypothetical performance reporting
        run: python -m unittest tests.test_paco_performance_report -v
      - name: Test PACO auditable paper ledger
        run: python -m unittest tests.test_paco_paper_ledger -v
      - name: Test PACO Oracle unified research pipeline
        run: python -m unittest tests.test_paco_oracle_pipeline -v
      - name: Test cash checkpoint run summary
        run: python -m unittest tests.test_cash_ledger_run_summary -v
      - name: Test append-only cash observation ledger
        run: python -m unittest tests.test_cash_observation_ledger -v
      - name: Test zero-trade observation baseline
        run: python -m unittest tests.test_observation_cash_baseline -v
      - name: Test feed run summary
        run: python -m unittest tests.test_feed_run_summary -v
      - name: Test feed evidence gate
        run: python -m unittest tests.test_feed_evidence -v
      - name: Test read-only Tradier paper bridge
        run: python -m unittest tests.test_tradier_paper_bridge -v
      - name: Validate Tradier daily bar fixtures
        run: python -m unittest tests.test_tradier_daily_bars -v
      - name: Offline guardrail tests
        run: python -m unittest discover -s tests -p 'test_*market*.py' -v && python -m unittest discover -s tests -p 'test_daily_focus.py' -v && python -m unittest discover -s tests -p 'test_conditional_paper.py' -v && python -m unittest discover -s tests -p 'test_paper_ledger.py' -v && python -m unittest discover -s tests -p 'test_paper_research_runner.py' -v && python -m unittest discover -s tests -p 'test_opportunity_dispatch.py' -v && python -m unittest discover -s tests -p 'test_dispatch_outbox.py' -v && python -m unittest discover -s tests -p 'test_forward_paper.py' -v && python -m unittest discover -s tests -p 'test_persistent_forward_runner.py' -v && python -m unittest discover -s tests -p 'test_paper_state_snapshot.py' -v

  observe:
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect six read-only market observations
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python research/multi_market_observer.py --output multi_market_observation.json
      - name: Assess observed feed quality
        if: always()
        run: |
          if [ -f multi_market_observation.json ]; then
            python -m research.feed_evidence --input multi_market_observation.json --output feed_evidence.json
          else
            printf '{"schema":"oracle-q-feed-evidence-v1","status":"FAIL","problems":["OBSERVATION_MISSING"],"orders_enabled":false}\n' > feed_evidence.json
            exit 1
          fi
      - name: Record verified no-trade cash benchmark
        run: python -m research.observation_cash_baseline --observation multi_market_observation.json --output cash_baseline.json
      - name: Restore previous verified cash observation checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREVIOUS=$(gh run list --repo "${{ github.repository }}" --workflow multi-market-observer.yml --branch main --status success --limit 30 --json databaseId --jq '.[].databaseId' | while read -r id; do
            if [ "$id" != "${{ github.run_id }}" ]; then
              if gh api "repos/${{ github.repository }}/actions/runs/$id/artifacts" --jq '.artifacts[].name' | grep -Fxq "multi-market-observation-$id"; then
                echo "$id"
                break
              fi
            fi
          done)
          if [ -n "$PREVIOUS" ]; then
            mkdir -p restore
            gh run download "$PREVIOUS" --repo "${{ github.repository }}" --name "multi-market-observation-$PREVIOUS" --dir restore
            if [ -s restore/cash_observation_ledger.json ]; then
              cp restore/cash_observation_ledger.json cash_observation_ledger.json
              echo "Restored cash ledger from run $PREVIOUS"
            else
              echo "::error::Prior successful observation artifact lacks cash ledger; refusing silent reset"
              exit 1
            fi
          else
            echo "No prior successful observation artifact: bootstrap"
          fi
      - name: Create first cash observation checkpoint
        run: python -m research.cash_observation_ledger --baseline cash_baseline.json --state cash_observation_ledger.json
      - name: Report cash checkpoint continuity in Actions summary
        run: python -m research.cash_ledger_run_summary --ledger cash_observation_ledger.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Produce daily focus research briefing
        run: python research/daily_focus.py --input multi_market_observation.json --output daily_market_focus.json
      - name: Show feed verification in GitHub run summary
        if: always()
        run: python -m research.feed_run_summary --evidence feed_evidence.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Diagnose read-only Tradier options endpoint access
        continue-on-error: true
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python -m research.paco_tradier_auth_diagnostic
      - name: Collect PACO read-only SPY option-chain evidence
        continue-on-error: true
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python -m research.paco_snapshot_collector --output paco_option_chain_snapshots.json
      - name: Restore prior PACO snapshot continuity
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p paco-restore
          PREVIOUS=$(gh run list --repo "${{ github.repository }}" --workflow multi-market-observer.yml --branch main --status success --limit 30 --json databaseId --jq '.[].databaseId' | while read -r id; do
            if [ "$id" != "${{ github.run_id }}" ]; then
              if gh api "repos/${{ github.repository }}/actions/runs/$id/artifacts" --jq '.artifacts[].name' | grep -Fxq "multi-market-observation-$id"; then
                echo "$id"
                break
              fi
            fi
          done)
          if [ -n "$PREVIOUS" ]; then
            gh run download "$PREVIOUS" --repo "${{ github.repository }}" --name "multi-market-observation-$PREVIOUS" --dir paco-restore
            if [ -s paco-restore/paco_snapshot_continuity.json ]; then
              echo "Restored PACO continuity from $PREVIOUS"
            elif [ -s paco-restore/paco_option_chain_snapshots.json ]; then
              echo "Prior PACO evidence predates continuity feature: new continuity genesis"
            else
              echo "Prior run has no PACO evidence: new continuity genesis"
            fi
          fi
      - name: Append verified PACO snapshot continuity
        if: always()
        continue-on-error: true
        run: |
          if [ -s paco_option_chain_snapshots.json ]; then
            python -m research.paco_snapshot_continuity --snapshot paco_option_chain_snapshots.json --prior paco-restore/paco_snapshot_continuity.json --output paco_snapshot_continuity.json --run-id "${{ github.run_id }}"
          else
            echo 'No PACO snapshots; continuity not advanced'
            exit 1
          fi
      - name: Compare PACO option premiums with prior run
        if: always()
        continue-on-error: true
        run: |
          if [ -s paco-restore/paco_option_chain_snapshots.json ] && [ -s paco_option_chain_snapshots.json ]; then
            python -m research.paco_premium_comparison --earlier paco-restore/paco_option_chain_snapshots.json --later paco_option_chain_snapshots.json --output paco_premium_comparison.json
          else
            echo 'No prior and current PACO collection pair; comparison deferred'
          fi
      - name: Audit hypothetical PACO quote outcomes
        if: always()
        continue-on-error: true
        run: |
          if [ -s paco_premium_comparison.json ]; then
            python -m research.paco_quote_outcome_audit --comparison paco_premium_comparison.json --output paco_quote_outcome_audit.json
          else
            echo 'No PACO premium comparison; outcome audit deferred'
          fi
      - name: Diagnose SPX historical symbol coverage
        if: always()
        continue-on-error: true
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python -m research.paco_spx_history_diagnostic --output paco_spx_history_diagnostic.json
      - name: Collect PACO SPX close signal evidence
        if: always()
        continue-on-error: true
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: |
          if [ -s paco_option_chain_snapshots.json ]; then
            python -m research.paco_spx_signal_feed --collection paco_option_chain_snapshots.json --output paco_spx_signal_evidence.json
          else
            echo 'PACO collection unavailable; SPX signal evidence deferred'
          fi
      - name: Gate PACO outcomes on independently supplied SPX close signal
        if: always()
        continue-on-error: true
        run: |
          if [ -s paco_premium_comparison.json ] && [ -s paco_spx_signal_evidence.json ]; then
            python -m research.paco_signal_gated_audit --comparison paco_premium_comparison.json --signal paco_spx_signal_evidence.json --output paco_signal_gated_audit.json
          else
            printf '{"schema":"paco-signal-gated-audit-v1","status":"SIGNAL_EVIDENCE_MISSING","orders_enabled":false,"strategy_profitability_proven":false,"eligible_contracts":0,"hypothetical_outcomes":[]}\\n' > paco_signal_gated_audit.json
            echo 'PACO strategy signal evidence unavailable; no trades or strategy returns inferred'
          fi
      - name: Show PACO options-feed status in Actions summary
        if: always()
        run: |
          if [ -f paco_option_chain_snapshots.json ]; then
            python -c 'import json,os; p=json.load(open("paco_option_chain_snapshots.json")); f=open(os.environ["GITHUB_STEP_SUMMARY"],"a"); f.write("\\n### PACO options-feed status: "+str(p.get("status","UNKNOWN"))+"\\n"); f.write("HTTP status: "+str(p.get("http_status","n/a"))+"\\n"); f.close()'
          else
            echo '### PACO options-feed status: MISSING (no evidence file)' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain evidence even on partial data failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-market-observation-${{ github.run_id }}
          path: |
            multi_market_observation.json
            daily_market_focus.json
            feed_evidence.json
            cash_baseline.json
            cash_observation_ledger.json
            paco_option_chain_snapshots.json
            paco_auth_diagnostic.json
            paco_snapshot_continuity.json
            paco_premium_comparison.json
            paco_quote_outcome_audit.json
            paco_signal_gated_audit.json
            paco_spx_signal_evidence.json
            paco_spx_history_diagnostic.json
          if-no-files-found: warn
          retention-days: 30
