name: Multi-market research observer (read only)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/multi-market-observer.yml'
  pull_request:
    paths:
      - "research/multi_market_observer.py"
      - "research/feed_evidence.py"
      - "research/observation_cash_baseline.py"
      - "research/cash_observation_ledger.py"
      - "tests/test_cash_observation_ledger.py"
      - "tests/test_observation_cash_baseline.py"
      - "research/feed_run_summary.py"
      - "tests/test_feed_run_summary.py"
      - "tests/test_feed_evidence.py"
      - "research/tradier_daily_bars.py"
      - "research/tradier_paper_bridge.py"
      - "tests/test_tradier_paper_bridge.py"
      - "tests/test_tradier_daily_bars.py"
      - "tests/test_multi_market_observer.py"
      - "tests/test_daily_focus.py"
      - "research/daily_focus.py"
      - "research/conditional_paper.py"
      - "tests/test_conditional_paper.py"
      - "research/paper_ledger.py"
      - "tests/test_paper_ledger.py"
      - "research/paper_research_runner.py"
      - "tests/test_paper_research_runner.py"
      - "research/opportunity_dispatch.py"
      - "tests/test_opportunity_dispatch.py"
      - "research/dispatch_outbox.py"
      - "tests/test_dispatch_outbox.py"
      - "research/forward_paper.py"
      - "tests/test_forward_paper.py"
      - "research/persistent_forward_runner.py"
      - "tests/test_persistent_forward_runner.py"
      - "research/paper_state_snapshot.py"
      - "tests/test_paper_state_snapshot.py"
      - ".github/workflows/multi-market-observer.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * 1-5"

permissions:
  contents: read
  actions: read

concurrency:
  group: oracle-q-live-observation-chain
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test append-only cash observation ledger
        run: python -m unittest tests.test_cash_observation_ledger -v
      - name: Test zero-trade observation baseline
        run: python -m unittest tests.test_observation_cash_baseline -v
      - name: Test feed run summary
        run: python -m unittest tests.test_feed_run_summary -v
      - name: Test feed evidence gate
        run: python -m unittest tests.test_feed_evidence -v
      - name: Test read-only Tradier paper bridge
        run: python -m unittest tests.test_tradier_paper_bridge -v
      - name: Validate Tradier daily bar fixtures
        run: python -m unittest tests.test_tradier_daily_bars -v
      - name: Offline guardrail tests
        run: python -m unittest discover -s tests -p 'test_*market*.py' -v && python -m unittest discover -s tests -p 'test_daily_focus.py' -v && python -m unittest discover -s tests -p 'test_conditional_paper.py' -v && python -m unittest discover -s tests -p 'test_paper_ledger.py' -v && python -m unittest discover -s tests -p 'test_paper_research_runner.py' -v && python -m unittest discover -s tests -p 'test_opportunity_dispatch.py' -v && python -m unittest discover -s tests -p 'test_dispatch_outbox.py' -v && python -m unittest discover -s tests -p 'test_forward_paper.py' -v && python -m unittest discover -s tests -p 'test_persistent_forward_runner.py' -v && python -m unittest discover -s tests -p 'test_paper_state_snapshot.py' -v

  observe:
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect six read-only market observations
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python research/multi_market_observer.py --output multi_market_observation.json
      - name: Assess observed feed quality
        if: always()
        run: |
          if [ -f multi_market_observation.json ]; then
            python -m research.feed_evidence --input multi_market_observation.json --output feed_evidence.json
          else
            printf '{"schema":"oracle-q-feed-evidence-v1","status":"FAIL","problems":["OBSERVATION_MISSING"],"orders_enabled":false}\n' > feed_evidence.json
            exit 1
          fi
      - name: Record verified no-trade cash benchmark
        run: python -m research.observation_cash_baseline --observation multi_market_observation.json --output cash_baseline.json
      - name: Restore previous verified cash observation checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREVIOUS=$(gh run list --repo "${{ github.repository }}" --workflow multi-market-observer.yml --branch main --status success --limit 30 --json databaseId --jq '.[].databaseId' | while read -r id; do
            if [ "$id" != "${{ github.run_id }}" ]; then
              if gh api "repos/${{ github.repository }}/actions/runs/$id/artifacts" --jq '.artifacts[].name' | grep -Fxq "multi-market-observation-$id"; then
                echo "$id"
                break
              fi
            fi
          done)
          if [ -n "$PREVIOUS" ]; then
            mkdir -p restore
            gh run download "$PREVIOUS" --repo "${{ github.repository }}" --name "multi-market-observation-$PREVIOUS" --dir restore
            if [ -s restore/cash_observation_ledger.json ]; then
              cp restore/cash_observation_ledger.json cash_observation_ledger.json
              echo "Restored cash ledger from run $PREVIOUS"
            else
              echo "Previous run has no cash ledger: bootstrap"
            fi
          else
            echo "No prior successful observation artifact: bootstrap"
          fi
      - name: Create first cash observation checkpoint
        run: python -m research.cash_observation_ledger --baseline cash_baseline.json --state cash_observation_ledger.json
      - name: Produce daily focus research briefing
        run: python research/daily_focus.py --input multi_market_observation.json --output daily_market_focus.json
      - name: Show feed verification in GitHub run summary
        if: always()
        run: python -m research.feed_run_summary --evidence feed_evidence.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Retain evidence even on partial data failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-market-observation-${{ github.run_id }}
          path: |
            multi_market_observation.json
            daily_market_focus.json
            feed_evidence.json
            cash_baseline.json
            cash_observation_ledger.json
          if-no-files-found: warn
          retention-days: 30
