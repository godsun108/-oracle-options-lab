name: Multi-market research observer (read only)

on:
  pull_request:
    paths:
      - "research/multi_market_observer.py"
      - "tests/test_multi_market_observer.py"
      - "tests/test_daily_focus.py"
      - "research/daily_focus.py"
      - "research/conditional_paper.py"
      - "tests/test_conditional_paper.py"
      - "research/paper_ledger.py"
      - "tests/test_paper_ledger.py"
      - "research/paper_research_runner.py"
      - "tests/test_paper_research_runner.py"
      - "research/opportunity_dispatch.py"
      - "tests/test_opportunity_dispatch.py"
      - "research/dispatch_outbox.py"
      - "tests/test_dispatch_outbox.py"
      - "research/forward_paper.py"
      - "tests/test_forward_paper.py"
      - "research/persistent_forward_runner.py"
      - "tests/test_persistent_forward_runner.py"
      - ".github/workflows/multi-market-observer.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * 1-5"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline guardrail tests
        run: python -m unittest discover -s tests -p 'test_*market*.py' -v && python -m unittest discover -s tests -p 'test_daily_focus.py' -v && python -m unittest discover -s tests -p 'test_conditional_paper.py' -v && python -m unittest discover -s tests -p 'test_paper_ledger.py' -v && python -m unittest discover -s tests -p 'test_paper_research_runner.py' -v && python -m unittest discover -s tests -p 'test_opportunity_dispatch.py' -v && python -m unittest discover -s tests -p 'test_dispatch_outbox.py' -v && python -m unittest discover -s tests -p 'test_forward_paper.py' -v && python -m unittest discover -s tests -p 'test_persistent_forward_runner.py' -v

  observe:
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect six read-only market observations
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python research/multi_market_observer.py --output multi_market_observation.json
      - name: Produce daily focus research briefing
        run: python research/daily_focus.py --input multi_market_observation.json --output daily_market_focus.json
      - name: Retain evidence even on partial data failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-market-observation-${{ github.run_id }}
          path: |
            multi_market_observation.json
            daily_market_focus.json
          if-no-files-found: warn
          retention-days: 30
