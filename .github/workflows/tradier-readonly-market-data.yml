name: Tradier Read-Only Market Data
on:
  workflow_dispatch:
  push:
    paths:
      - "tradier_readonly_smoke.py"
      - ".github/workflows/tradier-readonly-market-data.yml"
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install market-data dependency
        run: python -m pip install requests
      - name: Read-only Tradier smoke test
        env:
          TRADIER_PRODUCTION_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          TRADIER_SMOKE_SYMBOL: SPY
        run: python tradier_readonly_smoke.py
