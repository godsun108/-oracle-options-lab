name: Oracle-Q Arena Pages
on:
  push:
    branches: [main]
    paths:
      - 'arena/**'
      - 'tests/check_arena_html.mjs'
      - '.github/workflows/arena-pages.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Oracle-Q Arena Evidence Review']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '10 1 * * 2-6'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: oracle-q-arena-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch' || github.event.workflow_run.event == 'workflow_run') && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Arena HTML and JavaScript before deployment
        run: node tests/check_arena_html.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Obtain most recent reviewed production snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
        run: |
          mkdir -p out/arena-review
          RUN_ID="$TRIGGER_RUN_ID"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow arena-evidence-review.yml --branch main --status success --limit 30 --json databaseId,event,conclusion,status --jq '[.[] | select(.event == "schedule" or .event == "workflow_dispatch" or .event == "workflow_run")][0].databaseId // empty')
          fi
          if [ -z "$RUN_ID" ]; then
            echo "No review run yet; publish explicit empty research status"
            exit 0
          fi
          export RUN_ID
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > out/arena-review/source-run.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path("out/arena-review/source-run.json").read_text())
          assert r["id"] == int(os.environ["RUN_ID"])
          assert r["path"] == ".github/workflows/arena-evidence-review.yml"
          assert r["head_branch"] == "main"
          assert r["event"] in ("schedule","workflow_dispatch","workflow_run")
          assert r["head_repository"]["full_name"] == os.environ["GITHUB_REPOSITORY"]
          assert r["status"] == "completed" and r["conclusion"] == "success"
          PY
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name oracle-q-arena-evidence-review --dir out/arena-review
      - name: Project audited progress, or retain empty feed
        run: |
          if test -s out/arena-review/arena-frozen-league-review.json; then
            python -m research.arena_public_progress --review out/arena-review/arena-frozen-league-review.json --output out/arena-feed.json
          else
            cp arena/arena-feed.json out/arena-feed.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          page=Path("arena/index.html").read_text()
          feed=json.loads(Path("out/arena-feed.json").read_text())
          assert "NO VERIFIED LIVE FEED" in page and "arena-feed.json" in page
          assert feed["schema"] == "oracle-q-arena-feed-v1"
          assert feed["live"] is False and feed["orders_enabled"] is False and feed["edge_proven"] is False
          if feed["source_kind"] == "NO_VERIFIED_SCORECARD":
              assert feed["rows"] == []
          else:
              assert feed["source_kind"] == "AUDITED_FROZEN_PAPER_LEAGUE"
              assert len(feed["rows"]) == 6
          PY
      - name: Prepare public agent snapshot
        run: |
          if test -s out/arena-review/arena-agent-positions.json; then
            cp out/arena-review/arena-agent-positions.json out/arena-agent-positions.json
          else
            printf '%s\n' '{"schema":"oracle-q-arena-agent-positions-v1","source_kind":"NO_VERIFIED_AGENT_POSITIONS","price_is_live":false,"orders_enabled":false,"broker_fills_verified":false,"edge_proven":false,"positions":[],"warning":"No reviewed agent positions available."}' > out/arena-agent-positions.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('out/arena-agent-positions.json').read_text())
          assert d['schema']=='oracle-q-arena-agent-positions-v1'
          assert all(d[k] is False for k in ('price_is_live','orders_enabled','broker_fills_verified','edge_proven'))
          assert len(d['positions']) in (0,18)
          PY
      - name: Prepare audited agent event-mark history
        run: |
          if test -s out/arena-review/arena-agent-history.json; then
            cp out/arena-review/arena-agent-history.json out/arena-agent-history.json
          else
            printf '%s\n' '{"schema":"oracle-q-arena-agent-history-v1","source_kind":"NO_VERIFIED_HISTORY","orders_enabled":false,"price_is_live":false,"broker_fills_verified":false,"edge_proven":false,"history_is_daily":false,"promotion_eligible":false,"agents":[]}' > out/arena-agent-history.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("out/arena-agent-history.json").read_text())
          assert d["schema"]=="oracle-q-arena-agent-history-v1"
          assert all(d[k] is False for k in ("orders_enabled","price_is_live","broker_fills_verified","edge_proven","history_is_daily","promotion_eligible"))
          assert len(d["agents"]) in (0,18)
          PY
      - name: Prepare read-only paper snapshot delta
        run: |
          if test -s out/arena-review/arena-paper-delta.json; then
            cp out/arena-review/arena-paper-delta.json out/arena-paper-delta.json
          else
            printf '%s\n' '{"schema":"oracle-q-arena-paper-delta-v1","status":"NO_COMPARABLE_EVIDENCE","orders_enabled":false,"broker_fills_verified":false,"edge_proven":false}' > out/arena-paper-delta.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("out/arena-paper-delta.json").read_text())
          assert d["schema"]=="oracle-q-arena-paper-delta-v1"
          assert d["status"] in ("NO_COMPARABLE_EVIDENCE","REVIEWED_SNAPSHOT_COMPARISON")
          assert all(d[k] is False for k in ("orders_enabled","broker_fills_verified","edge_proven"))
          if d["status"]=="REVIEWED_SNAPSHOT_COMPARISON":
              assert d["agent_count"]==18 and len(d["rows"])==18
          PY
      - name: Prepare Pages site
        run: |
          mkdir -p _site
          mkdir -p _site/arena
          cp arena/index.html _site/arena/index.html
          cp out/arena-feed.json _site/arena/arena-feed.json
          cp out/arena-agent-positions.json _site/arena/arena-agent-positions.json
          cp out/arena-agent-history.json _site/arena/arena-agent-history.json
          cp out/arena-paper-delta.json _site/arena/arena-paper-delta.json
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=./arena/"><a href="./arena/">Oracle-Q Arena</a>\n' > _site/index.html
          printf 'Oracle-Q Arena is a research-only spectator preview. No verified live trading feed is connected.\n' > _site/arena/STATUS.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
