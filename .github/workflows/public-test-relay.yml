name: Public Test Relay Smoke
on:
  push:
    paths:
      - 'research/public_test_relay/**'
      - '.github/workflows/public-test-relay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run public synthetic relay smoke tests
        run: python -m unittest discover -s research/public_test_relay -p 'test_*.py' -v
