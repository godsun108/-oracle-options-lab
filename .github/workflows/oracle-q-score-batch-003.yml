name: Oracle Q Score Batch 003
on:
  workflow_dispatch:
  push:
    paths:
      - "oracle_q/score_batch_003.py"
      - ".github/workflows/oracle-q-score-batch-003.yml"
permissions:
  contents: read
  actions: read
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install pandas numpy pyarrow requests
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: gh run download 36360238971 -n oracle-q-edge-search-batch-003 -D manifest
      - run: python -m oracle_q.score_batch_003
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-q-batch-003-structural-map
          path: |
            out/oracle_q_batch_003.json
            out/oracle_q_batch_003_summary.csv
            out/oracle_q_batch_003_trades.csv
            out/oracle_q_batch_003_missing.csv
