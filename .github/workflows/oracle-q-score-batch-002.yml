name: Oracle Q Score Batch 002
on:
  workflow_dispatch:
  push:
    paths:
      - "oracle_q/score_batch_002.py"
      - ".github/workflows/oracle-q-score-batch-002.yml"
permissions:
  contents: read
  actions: read
jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install pandas numpy scipy scikit-learn
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: gh run download 36257234984 -n oracle-o1-o6-results -D oracle
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: gh run download 36359840870 -n oracle-q-edge-search-batch-002 -D manifest
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: gh run download 36353708837 -R godsun108/Seldon -n seldon-experiment-004 -D seldon_artifact
      - run: python -m oracle_q.score_batch_002
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-q-batch-002-scores
          path: out/oracle_q_batch_002_scores.json
