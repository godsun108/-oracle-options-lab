name: Oracle x Seldon Fusion 002
on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/oracle_seldon_fusion_002.py"
      - ".github/workflows/oracle-seldon-fusion-002.yml"
permissions:
  contents: read
  actions: read
jobs:
  economic-value:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pandas numpy
      - name: Download frozen Fusion 001 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 36354506749 -n oracle-seldon-fusion-001 -D fusion001
          test -f fusion001/oracle_seldon_fusion_001_predictions.csv
      - name: Download frozen Oracle Stage-9 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 36257234984 -n oracle-o1-o6-results -D oracle
          test -f oracle/oracle_stage9_options_trades.csv
      - name: Execute preregistered economic-value test
        run: python experiments/oracle_seldon_fusion_002.py
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-seldon-fusion-002
          path: |
            out/oracle_seldon_fusion_002.json
            out/oracle_seldon_fusion_002_summary.csv
            out/oracle_seldon_fusion_002_selected.csv
          retention-days: 30
