name: Oracle Q Score Batch 001
on:
  workflow_dispatch:
  push:
    paths:
      - "oracle_q/score_batch_001.py"
      - ".github/workflows/oracle-q-score-batch-001.yml"
permissions:
  contents: read
  actions: read
jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pandas numpy scipy scikit-learn
      - name: Frozen Oracle evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 36257234984 -n oracle-o1-o6-results -D oracle
      - name: Frozen Q batch manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 36359375289 -n oracle-q-edge-search-batch-001 -D manifest
      - name: Canonical Seldon feature
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 36353708837 -R godsun108/Seldon -n seldon-experiment-004 -D seldon_artifact
      - run: python -m oracle_q.score_batch_001
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-q-batch-001-scores
          path: out/oracle_q_batch_001_scores.json
