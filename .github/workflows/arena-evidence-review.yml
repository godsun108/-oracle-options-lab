name: Oracle-Q Arena Evidence Review
on:
  workflow_dispatch:
  schedule:
    - cron: '10 0 * * 2-6'
  pull_request:
    paths:
      - 'research/arena_frozen_league.py'
      - 'research/export_arena_frozen_league.py'
      - 'research/arena_public_progress.py'
      - 'research/arena_agent_positions.py'
      - 'research/arena_agent_history.py'
      - 'research/arena_paper_delta.py'
      - 'tests/test_arena_paper_delta.py'
      - 'research/agent_equity_history.py'
      - 'tests/test_arena_agent_positions.py'
      - 'research/agent_paper_portfolio.py'
      - 'tests/test_agent_paper_portfolio.py'
      - 'tests/test_arena_public_progress.py'
      - 'tests/test_arena_frozen_league.py'
      - '.github/workflows/arena-evidence-review.yml'
permissions:
  contents: read
  actions: read
jobs:
  evidence-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install pytest numpy pandas requests scikit-learn
      - name: Verify frozen-league adapter
        run: python -m pytest -q tests/test_arena_frozen_league.py tests/test_edge_paper_league.py tests/test_arena_public_progress.py tests/test_arena_paper_delta.py
      - name: Retrieve latest successful production Edge Lab artifact
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/edge-source
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow edge-lab.yml --branch main --status success --limit 30 --json databaseId,event --jq '[.[] | select(.event == "schedule" or .event == "workflow_dispatch" or .event == "push")][0].databaseId // empty')
          if [ -n "$RUN_ID" ]; then
            export RUN_ID
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > out/edge-source/source-run.json
            python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("out/edge-source/source-run.json").read_text())
          assert r["id"] == int(__import__("os").environ["RUN_ID"]), "run identity mismatch"
          assert r["head_branch"] == "main", "not a main-branch run"
          assert r["conclusion"] == "success" and r["status"] == "completed", "not a completed successful run"
          assert r["event"] in ("schedule", "workflow_dispatch", "push"), "not a production event"
          assert r["path"] == ".github/workflows/edge-lab.yml", "not Edge Lab production workflow"
          PY
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "oracle-edge-lab-$RUN_ID" --dir out/edge-source
            test -s out/edge-source/edge_forward_ledger.json
          fi
      - name: Validate and export reviewed simulated agent holdings
        run: |
          if test -s out/edge-source/agent_paper_positions.json; then
            python -m research.arena_agent_positions --source out/edge-source/agent_paper_positions.json --output out/arena-agent-positions.json
            python -m research.arena_agent_history --source out/edge-source/agent_paper_positions.json --output out/arena-agent-history.json
          else
            echo 'Agent position evidence unavailable in selected production run; no holdings published.'
          fi
      - name: Export audited evidence or explicit missing status
        run: |
          if test -s out/edge-source/edge_forward_ledger.json; then
            python -m research.export_arena_frozen_league --ledger out/edge-source/edge_forward_ledger.json
          else
            mkdir -p out
            printf '%s\\n' '{"schema":"oracle-q-arena-review-status-v1","status":"NO_LEDGER_AVAILABLE","published":false,"orders_enabled":false,"warning":"No eligible production edge-lab ledger was available. No scores generated."}' > out/arena-review-status.json
          fi
      - name: Compare with previous reviewed production snapshot
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/previous-review
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow arena-evidence-review.yml --branch main --status success --limit 30 --json databaseId,event --jq '[.[] | select(.event == "schedule" or .event == "workflow_dispatch")][0].databaseId // empty')
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name oracle-q-arena-evidence-review --dir out/previous-review
          fi
          if test -s out/previous-review/arena-agent-positions.json && test -s out/arena-agent-positions.json; then
            python -m research.arena_paper_delta --previous out/previous-review/arena-agent-positions.json --current out/arena-agent-positions.json --output out/arena-paper-delta.json
          else
            printf '%s\\n' '{"schema":"oracle-q-arena-paper-delta-v1","status":"NO_COMPARABLE_EVIDENCE","orders_enabled":false,"broker_fills_verified":false,"edge_proven":false}' > out/arena-paper-delta.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-q-arena-evidence-review
          path: |
            out/arena-frozen-league-review.json
            out/arena-agent-positions.json
            out/arena-agent-history.json
            out/arena-paper-delta.json
            out/arena-review-status.json
          if-no-files-found: error
          retention-days: 30
