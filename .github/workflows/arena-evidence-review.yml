name: Oracle-Q Arena Evidence Review
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/arena_frozen_league.py'
      - 'research/export_arena_frozen_league.py'
      - 'tests/test_arena_frozen_league.py'
      - '.github/workflows/arena-evidence-review.yml'
permissions:
  contents: read
  actions: read
jobs:
  evidence-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install pytest numpy pandas requests scikit-learn
      - name: Verify frozen-league adapter
        run: python -m pytest -q tests/test_arena_frozen_league.py tests/test_edge_paper_league.py
      - name: Retrieve latest successful production Edge Lab artifact
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/edge-source
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow edge-lab.yml --branch main --status success --limit 30 --json databaseId,event --jq '[.[] | select(.event == "schedule" or .event == "workflow_dispatch" or .event == "push")][0].databaseId // empty')
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "oracle-edge-lab-$RUN_ID" --dir out/edge-source
            test -s out/edge-source/edge_forward_ledger.json
          fi
      - name: Export audited evidence or explicit missing status
        run: |
          if test -s out/edge-source/edge_forward_ledger.json; then
            python -m research.export_arena_frozen_league --ledger out/edge-source/edge_forward_ledger.json
          else
            mkdir -p out
            printf '%s\\n' '{"schema":"oracle-q-arena-review-status-v1","status":"NO_LEDGER_AVAILABLE","published":false,"orders_enabled":false,"warning":"No eligible production edge-lab ledger was available. No scores generated."}' > out/arena-review-status.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-q-arena-evidence-review
          path: |
            out/arena-frozen-league-review.json
            out/arena-review-status.json
          if-no-files-found: error
          retention-days: 30
