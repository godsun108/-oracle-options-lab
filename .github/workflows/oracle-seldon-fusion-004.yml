name: Oracle x Seldon Fusion 004
on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/oracle_seldon_fusion_004.py"
      - ".github/workflows/oracle-seldon-fusion-004.yml"
permissions:
  contents: read
  actions: read
jobs:
  price-aware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pandas numpy scipy scikit-learn
      - name: Download frozen Oracle evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 36257234984 -n oracle-o1-o6-results -D oracle
      - name: Download canonical Seldon feature
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 36353708837 -R godsun108/Seldon -n seldon-experiment-004 -D seldon_artifact
      - name: Run frozen price-aware experiment
        run: python experiments/oracle_seldon_fusion_004.py
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-seldon-fusion-004
          path: |
            out/oracle_seldon_fusion_004.json
            out/oracle_seldon_fusion_004_summary.csv
            out/oracle_seldon_fusion_004_predictions.csv
          retention-days: 30

